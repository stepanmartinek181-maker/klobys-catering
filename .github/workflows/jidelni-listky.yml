name: Zveřejnit jídelní lístky

on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write

concurrency:
  group: klobys-jidelni-listky
  cancel-in-progress: false

jobs:
  publish:
    # Numeric ID remains stable if the owner changes their GitHub login.
    # Also update this gate when a customer editor is explicitly approved.
    if: github.event_name == 'workflow_dispatch' || github.event.sender.id == 238918077
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Načíst ověřený kód z hlavní větve
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit pravidla jídelních lístků
        run: node --test .github/scripts/menu-parser.test.mjs

      - name: Připravit veřejné lístky
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/compile-menus.mjs

      - name: Uložit pouze změněná veřejná data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- menus.json menus-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizovat jídelní lístky od správce'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Výslovně spustit GitHub Pages build
        # GITHUB_TOKEN commits do not automatically trigger legacy Pages builds.
        # Run also when JSON is unchanged so a previous failed deploy can be retried.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/request-pages-build.mjs
